name: Bug report
description: Report a reproducible defect.
title: "bug: "
labels: ["type: bug"]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, OS and device
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed API keys, private memories, room scans, faces and private camera/media data from attachments.
          required: true

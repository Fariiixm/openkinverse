name: graph

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Build knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAPHIFY_VERSION: '0.9.111'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Graphify
        run: python -m pip install --disable-pip-version-check "graphifyy==${GRAPHIFY_VERSION}"
      - name: Build graph (local AST extraction only)
        run: graphify update . --force
      - name: Verify graph
        run: |
          test -s graphify-out/graph.json
          graphify query "architecture decisions" | head -n 20
      - name: Upload graph artifact
        uses: actions/upload-artifact@v7
        with:
          name: graphify-out
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          retention-days: 7
